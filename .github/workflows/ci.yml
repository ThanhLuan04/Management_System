# Chạy toàn bộ kiểm tra cho mỗi lần push / pull request vào main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  # Chỉ dùng trong CI: database tạm của service container, khóa JWT giả
  DATABASE_URL: postgresql+psycopg://smartstore:ci_password@localhost:5432/smartstore_dev
  TEST_DATABASE_URL: postgresql+psycopg://smartstore:ci_password@localhost:5432/smartstore_test
  JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789

jobs:
  backend:
    name: Backend (ruff, pytest, pip-audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smartstore
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: smartstore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartstore" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Quét lỗ hổng thư viện
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  frontend:
    name: Frontend (typecheck, vitest, build, npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Quét lỗ hổng thư viện
        run: npm audit --audit-level=high

  docker:
    name: Docker (build + chạy thử cả cụm)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Tạo .env tạm
        run: |
          cat > .env <<EOF
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET_KEY=$(openssl rand -hex 32)
          SITE_ADDRESS=:80
          PUBLIC_URL=http://localhost
          ENVIRONMENT=production
          EOF
      - name: Build và khởi động
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Kiểm tra qua Caddy
        run: |
          set -eux
          # Frontend + header bảo mật
          curl -fsS -D headers.txt -o index.html http://localhost/
          grep -q '<div id="root">' index.html
          grep -qi '^content-security-policy:' headers.txt
          grep -qi '^strict-transport-security:' headers.txt
          # Route của React (không phải file thật) vẫn trả index.html
          curl -fsS http://localhost/products | grep -q '<div id="root">'
          # API qua reverse proxy, database kết nối được
          curl -fsS http://localhost/api/v1/health | grep -q '"database":"ok"'
          # Migration đã chạy: đăng nhập sai trả 401 (bảng users tồn tại), không phải 500
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"username":"khongtontai","password":"SaiMatKhau1"}' http://localhost/api/v1/auth/login)
          test "$code" = "401"
          # Production: backend tắt Swagger (gọi thẳng trong container — Caddy không chuyển /docs sang backend)
          docker compose exec -T backend python -c "
          import urllib.request, urllib.error
          for path in ('/docs', '/openapi.json'):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000' + path)
                  raise SystemExit(path + ' vẫn mở trong production')
              except urllib.error.HTTPError as e:
                  assert e.code == 404, (path, e.code)
          "
          # Backend và database không mở cổng ra ngoài máy
          if curl -s --max-time 3 -o /dev/null http://localhost:8000/; then echo "cổng 8000 đang mở" && exit 1; fi
          if timeout 3 bash -c '</dev/tcp/127.0.0.1/5432'; then echo "cổng 5432 đang mở" && exit 1; fi
      - name: Sao lưu database
        run: |
          chmod +x scripts/backup_db.sh
          ./scripts/backup_db.sh
          test -s "$(ls -1t backups/*.dump | head -n 1)"
      - name: Log khi lỗi
        if: failure()
        run: docker compose logs --no-color

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: smartstore
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: smartstore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartstore" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # playwright.config.ts gọi backend/.venv/bin/python
      - name: Cài backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Cài frontend và trình duyệt
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

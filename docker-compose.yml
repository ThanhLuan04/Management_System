# Chạy toàn bộ SmartStore: PostgreSQL + backend (FastAPI) + Caddy (frontend + reverse proxy + HTTPS).
#   cp .env.example .env   # rồi điền mật khẩu, khóa JWT, địa chỉ trang
#   docker compose up -d --build
# Chỉ Caddy mở cổng ra ngoài; database và backend nằm trong mạng nội bộ của Docker.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Cần đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: smartstore
    volumes:
      # PostgreSQL 18 lưu dữ liệu dưới /var/lib/postgresql/<phiên bản>/ → gắn volume ở thư mục cha
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartstore -d smartstore"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://smartstore:${POSTGRES_PASSWORD}@db:5432/smartstore
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Cần đặt JWT_SECRET_KEY trong .env}
      # Refresh/đăng xuất chỉ chấp nhận request từ đúng địa chỉ trang
      CORS_ORIGINS: ${PUBLIC_URL:?Cần đặt PUBLIC_URL trong .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - uploads:/app/uploads

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data # chứng chỉ HTTPS
      - caddy_config:/config

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
